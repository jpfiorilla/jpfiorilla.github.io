<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recent Sets Overlay</title>
    <link rel="icon" href="images/favicon_slash.ico" type="image/x-icon" />
    <link rel="stylesheet" href="recent-sets.css" />
  </head>
  <body>
    <div id="startggErrorMessage"></div>
    <div class="overlay">
      <!-- Config Panel -->
      <form id="configPanel">
        <div id="tokenField">
          <input
            id="tokenInput"
            placeholder="Paste Start.gg API Token (not needed for parry.gg)"
            type="password"
          />
          <a
            href="https://developer.start.gg/docs/authentication"
            target="_blank"
            style="
              color: #22c55e;
              font-size: 14px;
              margin-left: 8px;
              text-decoration: none;
            "
          >
            Need a token?
          </a>
          <br />
        </div>
        <input
          id="urlInput"
          placeholder="Paste Start.gg or parry.gg event URL"
        /><br />
        <button type="submit">Start</button>
        <div id="configError"></div>
      </form>

      <!-- Header -->
      <div class="header">Recent Results</div>

      <!-- Sets Container -->
      <div id="setsContainer"></div>

      <!-- Match History (auto-phases with Recent Results; rendered by JS) -->
      <div id="matchHistoryContainer"></div>

      <div id="waitingMessage">Connected — waiting for completed sets…</div>

      <!-- Footer -->
      <div class="footer">
        <p>In Partnership With</p>
        <img src="images/nycmelee.jpg" alt="NYC Melee" />
        <img src="images/osnyc.jpg" alt="Partner Logo" />
      </div>
    </div>

    <!-- Setup helpers — never shown inside OBS -->
    <div id="streamControls">
      <button id="copyObsLinkBtn" type="button">Copy OBS link</button>
      <button id="changeSetupBtn" type="button" class="secondary">
        Change setup
      </button>
      <button id="debugBtn" type="button" class="secondary">Debug</button>
    </div>

    <div id="debugPanel">
      <div id="debugInfo"></div>
      <div id="debugActions">
        <button id="swapViewBtn" type="button" class="secondary">
          🔄 Swap view
        </button>
        <button id="autoPhaseBtn" type="button" class="secondary">
          ⏸ Auto
        </button>
        <button id="scrollUpBtn" type="button" class="secondary">▲</button>
        <button id="scrollDownBtn" type="button" class="secondary">▼</button>
      </div>
    </div>

    <script src="recent-sets-config.js"></script>
    <script src="recent-sets-core.js"></script>
    <script src="recent-sets-api.js"></script>
    <script src="recent-sets-views.js"></script>
    <script src="recent-sets.js"></script>
  </body>
</html>
