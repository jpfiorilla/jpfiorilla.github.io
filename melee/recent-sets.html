<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Start.gg Bracket Overlay</title>
    <link rel="icon" href="images/favicon_slash.ico" type="image/x-icon" />
    <style>
      @font-face {
        font-family: "Coolvetica";
        src: url("fonts/Coolvetica Rg.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      /* Animation for new sets sliding in from the right */
      @keyframes slideInHorizontal {
        0% {
          transform: translateX(120%);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .set.new {
        animation: slideInHorizontal 0.6s ease-out;
      }

      .mono {
        font-family: "Courier New", monospace;
      }

      body {
        margin: 0;
        padding: 0;
        background: #0d1b2a;
        font-family: "Coolvetica", Arial, sans-serif;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      #startggErrorMessage {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 1.5rem;
        padding: 8px;
        box-sizing: border-box;
        color: #f87171;
        z-index: 10;
      }

      #tokenField {
        display: flex;
        flex-direction: column;
        padding-top: 32px;
      }

      .overlay {
        width: 100%;
        height: 100%;
        max-width: 640px;
        max-height: 597px;
        padding: 10px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .header {
        font-weight: bold;
        font-size: clamp(48px, 5vw, 64px);
        text-align: center;
        letter-spacing: 3px;
        margin-bottom: 24px;
        color: #ffffff;
        display: none;
      }

      #setsContainer {
        display: none;
        grid-template-columns: 1fr;
        gap: 8px;
        width: 100%;
        justify-items: center;
        min-height: 340px;
      }

      .set {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr auto;
        align-items: center;
        gap: 16px;
        border-radius: 40px;
        width: 95%;
        font-size: clamp(20px, 1.5vw, 22px);
        font-weight: bold;
        position: relative;
        /* background: #14253d; */
        /* border: 3px solid #ff00aa; */
        /* padding: 8px 12px; */
      }

      .set .set-background {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 12px;
        bottom: 12px;
        z-index: -1;
        background: #14253d;
      }

      .score {
        width: clamp(40px, 6vw, 60px);
        height: clamp(40px, 6vw, 60px);
        border-radius: 50%;
        border: 3px solid #f63c4c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(24px, 2vw, 28px);
        font-weight: bold;
        color: #ffffff;
        background: #14253d;
      }

      .score.winner {
        border-color: #22c55e;
      }

      .player-name {
        flex: 1;
        text-align: center;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        min-width: 60px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .player-name span {
        display: inline-block;
        max-width: 100%;
        font-size: clamp(0.8rem, 4vw, 1.2rem);
        letter-spacing: 1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-name.left {
        text-align: left;
      }

      .player-name.right {
        text-align: right;
        justify-self: right;
      }


      .vs {
        font-size: 22px;
        color: #cbd5e1;
        padding: 0 10px;
      }

      .placement {
        font-size: 14px;
        color: #cbd5e1; /* similar to VS text */
        opacity: 0.8;
        text-align: center;
        margin-top: 4px;
        letter-spacing: 0.5px;
      }

      .footer {
        display: none;
        text-align: center;
        margin-top: 12px;
        font-size: 18px;
        color: #cbd5e1;
        opacity: 0.8;
      }

      .footer img {
        height: 64px;
        margin: 10px;
        border-radius: 50%;
      }

      #configPanel {
        margin-bottom: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
      }

      #configPanel.hidden {
        display: none;
      }

      input {
        min-width: 220px;
        padding: 8px;
        font-size: 18px;
        border-radius: 6px;
        border: 2px solid #334155;
        background: #1e293b;
        color: #fff;
      }

      button {
        padding: 8px 16px;
        font-size: 18px;
        border-radius: 6px;
        border: none;
        background-color: #22c55e;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s ease;
      }

      button:hover {
        background-color: #1da64d;
      }
    </style>
  </head>
  <body>
    <div id="startggErrorMessage"></div>
    <div class="overlay">
      <!-- Config Panel -->
      <form id="configPanel">
        <div id="tokenField">
          <input
            id="tokenInput"
            placeholder="Paste Start.gg API Token"
            type="password"
          />
          <a
            href="https://developer.start.gg/docs/authentication"
            target="_blank"
            style="
              color: #22c55e;
              font-size: 14px;
              margin-left: 8px;
              text-decoration: none;
            "
          >
            Need a token?
          </a>
          <br />
        </div>
        <input id="urlInput" placeholder="Paste Start.gg event URL" /><br />
        <button type="submit">Start</button>
      </form>

      <!-- Header -->
      <div class="header">Recent Results</div>

      <!-- Sets Container -->
      <div id="setsContainer"></div>

      <!-- Footer -->
      <div class="footer">
        <p>In Partnership With</p>
        <img src="images/nycmelee.jpg" alt="NYC Melee" />
        <img src="images/osnyc.jpg" alt="Partner Logo" />
      </div>
    </div>

    <script src="recent-sets-config.js"></script>
    <script>
      const API_URL = "https://api.start.gg/gql/alpha";
      let pollingInterval;
      let entrantPlacements = {};

      const params = new URLSearchParams(window.location.search);
      let authToken =
        params.get("token") ||
        params.get("t") ||
        window.STARTGG_TOKEN ||
        localStorage.getItem("startggToken") ||
        "";

      if (authToken) document.getElementById("tokenInput").value = authToken;

      let eventUrl =
        params.get("url") || params.get("u") || window.STARTGG_URL || "";

      if (authToken && eventUrl) {
        document.getElementById("configPanel").classList.add("hidden");
        startOverlay();
      }

      document
        .getElementById("configPanel")
        .addEventListener("submit", startOverlay);

      async function fetchData(slug) {
        const query = `
          query EventSetsAndEntrants($slug: String!) {
            event(slug: $slug) {
              numEntrants
              sets(perPage: 5, page: 1, sortType: RECENT) {
                nodes {
                  id
                  round
                  fullRoundText
                  slots {
                    entrant { id name }
                    standing { stats { score { value } } }
                  }
                }
              }
              entrants(query: { perPage: 10 }) {
                nodes {
                  id
                  standing { placement }
                }
              }
            }
          }
        `;
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + authToken,
            },
            body: JSON.stringify({ query, variables: { slug } }),
          });
          const json = await res.json();

          if (!json.data || json.success === false) {
            console.error("Error fetching data: ", json.message || json);
            document.getElementById("startggErrorMessage").innerHTML =
              `Start.gg error message: ${json.message}`;
            return { error: true };
          }

          document.getElementById("startggErrorMessage").innerHTML = "";

          return {
            sets: json.data.event?.sets?.nodes || [],
            entrants: json.data.event?.entrants?.nodes || [],
            numEntrants: json.data.event?.numEntrants || 0,
          };
        } catch (err) {
          console.error("Network error fetching data: ", err);
          document.getElementById("startggErrorMessage").innerHTML =
            "Network error contacting Start.gg. Retrying…";
          return { error: true };
        }
      }

      function buildEntrantPlacementMap(entrants) {
        entrantPlacements = {};
        entrants.forEach((entrant) => {
          if (entrant?.id && entrant.standing?.placement) {
            entrantPlacements[entrant.id] = entrant.standing.placement;
          }
        });
      }

      function escapeHtml(str) {
        return String(str).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      }

      function extractPlayerTag(entrantName) {
        if (!entrantName) return "TBD";

        // Split by | and take the last part (the tag)
        const parts = entrantName.split("|");
        return parts[parts.length - 1].trim();
      }

      function formatRound(set) {
        if (!set) return "VS";
        const txt = (set.fullRoundText || "").toLowerCase();
        const N = tournamentInfo.bracketSize || 2;

        // Finals
        if (txt.includes("grand final")) return "GF";
        if (txt.includes("losers final")) return "LF";
        if (txt.includes("winners final")) return "WF";

        // Semis / Quarters
        if (txt.includes("winners semi")) return "WSF";
        if (txt.includes("losers semi")) return "LSF";
        if (txt.includes("winners quarter")) return "WQF";
        if (txt.includes("losers quarter")) return "LQF";

        // If we have a numeric round from set.round, use that
        const r = set.round;
        if (typeof r === "number") {
          if (r > 0) {
            // Winners: round 1 = Top N, round 2 = Top N/2, etc.
            const topN = N / Math.pow(2, r - 1);
            return `W.T${topN}`;
          }
          if (r < 0) {
            // Losers: rounds come in pairs
            const k = Math.abs(r);
            const index = Math.ceil(k / 2);
            const topN = N / Math.pow(2, index - 1);
            return `L.T${topN}`;
          }
        }

        return "VS";
      }

      function getOrdinal(num) {
        if (!num) return "";
        const s = ["th", "st", "nd", "rd"];
        const v = num % 100;
        return num + (s[(v - 20) % 10] || s[v] || s[0]);
      }

      // A short string capturing everything we render for a set, so a poll
      // that changed nothing can skip re-rendering entirely.
      function setSignature(set) {
        const scores = set.slots.map(
          (s) => s?.standing?.stats?.score?.value ?? "-"
        );
        return `${set.id}:${scores.join("-")}`;
      }

      function buildSetHtml(set) {
        const [p1, p2] = set.slots;
        let p1Score = parseInt(p1?.standing?.stats?.score?.value ?? "-");
        let p2Score = parseInt(p2?.standing?.stats?.score?.value ?? "-");

        // Handle DQ logic
        if (p1Score === -1) {
          p1Score = "DQ";
          p2Score = "W";
        } else if (p2Score === -1) {
          p2Score = "DQ";
          p1Score = "W";
        }

        // Figure out the loser so we can show their final placement.
        let loserId = null;
        if (!isNaN(parseInt(p1Score)) && !isNaN(parseInt(p2Score))) {
          if (parseInt(p1Score) > parseInt(p2Score)) {
            loserId = p2?.entrant?.id;
          } else if (parseInt(p2Score) > parseInt(p1Score)) {
            loserId = p1?.entrant?.id;
          }
        }

        let p1PlacementText = "";
        let p2PlacementText = "";
        if (
          loserId &&
          (set.round < 0 ||
            (set.fullRoundText &&
              set.fullRoundText.toLowerCase().includes("grand final")))
        ) {
          const placement = entrantPlacements[loserId];
          if (placement) {
            const text = getOrdinal(placement);
            if (loserId === p1?.entrant?.id) {
              p1PlacementText = text;
            } else if (loserId === p2?.entrant?.id) {
              p2PlacementText = text;
            }
          }
        }

        const p1ScoreClass = `score${
          p1Score === "W" || p1Score > p2Score ? " winner" : ""
        }`;
        const p2ScoreClass = `score${
          p2Score === "W" || p2Score > p1Score ? " winner" : ""
        }`;

        return `
            <div class="${p1ScoreClass}">${p1Score}</div>
            <div class="player-name left">
              <span>${escapeHtml(extractPlayerTag(p1?.entrant?.name))}</span>
              ${
                p1PlacementText
                  ? `<div class="placement">(${p1PlacementText})</div>`
                  : ""
              }
            </div>
            <div class="vs mono">${formatRound(set)}</div>
            <div class="player-name right">
              ${
                p2PlacementText
                  ? `<div class="placement">(${p2PlacementText})</div>`
                  : ""
              }
              <span>${escapeHtml(extractPlayerTag(p2?.entrant?.name))}</span>
            </div>
            <div class="${p2ScoreClass}">${p2Score}</div>
            <div class="set-background"></div>
          `;
      }

      let hasRenderedOnce = false;
      let lastSignature = "";
      function renderSets(sets) {
        const top = sets.slice(0, 4);
        const signature = top.map(setSignature).join("|");
        if (signature === lastSignature) return; // nothing changed since last poll
        lastSignature = signature;

        // Reveal the overlay once the first batch of results arrives.
        if (!hasRenderedOnce && top.length > 0) {
          document.querySelector(".header").style.display = "block";
          document.getElementById("setsContainer").style.display = "grid";
          document.querySelector(".footer").style.display = "block";
        }

        const container = document.getElementById("setsContainer");
        const newIds = top.map((s) => String(s.id));
        const existingIds = new Set(
          Array.from(container.querySelectorAll(".set")).map(
            (el) => el.dataset.id
          )
        );

        // Remove cards for sets no longer in the recent list.
        container.querySelectorAll(".set").forEach((el) => {
          if (!newIds.includes(el.dataset.id)) el.remove();
        });

        // Add or update a card for each current set.
        top.forEach((set) => {
          const id = String(set.id);
          const sig = setSignature(set);
          let div = container.querySelector(`.set[data-id="${id}"]`);

          if (!div) {
            div = document.createElement("div");
            div.className = "set";
            div.dataset.id = id;
            div.innerHTML = buildSetHtml(set);
            // Slide genuinely-new sets in, but don't animate the first paint.
            if (hasRenderedOnce && !existingIds.has(id)) {
              div.classList.add("new");
              setTimeout(() => div.classList.remove("new"), 600);
            }
            container.appendChild(div);
          } else if (div.dataset.sig !== sig) {
            // Score (or other content) changed — update in place.
            div.innerHTML = buildSetHtml(set);
          }
          div.dataset.sig = sig;
        });

        // Keep DOM order matching the most-recent-first order from the API.
        newIds.forEach((id) => {
          const el = container.querySelector(`.set[data-id="${id}"]`);
          if (el) container.appendChild(el);
        });

        hasRenderedOnce = true;
      }

      function extractSlugFromUrl(url) {
        const match = url.match(
          /start\.gg\/tournament\/([^\/]+)\/event\/([^\/]+)/
        );
        if (match) {
          return `tournament/${match[1]}/event/${match[2]}`;
        } else {
          alert(
            "Could not extract event slug from URL. Make sure it's a direct event link like 'https://www.start.gg/tournament/.../event/...'"
          );
          return null;
        }
      }

      let tournamentInfo = { entrantsCount: 0 };

      function buildTournamentInfo(numEntrants) {
        const powerOfTwo = 1 << Math.ceil(Math.log2(numEntrants));
        tournamentInfo = {
          entrantsCount: numEntrants,
          bracketSize: powerOfTwo,
        };
      }

      function startOverlay(e) {
        if (e) e.preventDefault();

        if (!authToken) {
          authToken = document.getElementById("tokenInput").value.trim();
          if (!authToken) {
            alert("Please enter your Start.gg API token.");
            return;
          }
          localStorage.setItem("startggToken", authToken);
        }

        if (!eventUrl) {
          eventUrl = document.getElementById("urlInput").value.trim();
          if (!eventUrl) {
            alert("Please enter a Start.gg event URL.");
            return;
          }
        }

        const slug = extractSlugFromUrl(eventUrl);
        if (!slug) return;

        document.getElementById("configPanel").classList.add("hidden");

        if (window.ENABLE_POLLING !== false) {
          if (pollingInterval) clearInterval(pollingInterval);
          pollingInterval = setInterval(async () => {
            const result = await fetchData(slug);
            if (result.error) return;
            const { sets, entrants, numEntrants } = result;
            buildEntrantPlacementMap(entrants);
            buildTournamentInfo(numEntrants);
            renderSets(sets);
          }, 5000);
        }

        (async () => {
          const result = await fetchData(slug);
          if (result.error) return;
          const { sets, entrants, numEntrants } = result;
          buildEntrantPlacementMap(entrants);
          buildTournamentInfo(numEntrants);
          renderSets(sets);
        })();
      }
    </script>
  </body>
</html>
